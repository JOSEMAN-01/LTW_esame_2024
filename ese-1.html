<!-- modifica della soluzione originale, per svolgere il punto 3: Controlli senza JS-->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 1</title>
    <script>
        function valida(){
            var myForm = document.myForm;

            // 3. Validazione Email O Telefono obbligatori
            var email = myForm.email.value.trim();
            if (email === "" && telefono === "") {
                alert("Devi inserire almeno uno tra email e numero di telefono.");
                return false;
            }

            return true;
        }
    </script>
</head>
<body>
    <!-- Aggiunto "return" prima di valida() -->
    <form action="" method="post" name="myForm" enctype="multipart/form-data" onsubmit="return valida();">
        Nome: <input type="text" name="nome" id="nome" maxlength="30" required><br>
        Email: <input type="email" name="email" id="email"><br>
        Password: <input type="password" name="password" id="password" required><br>
        Numero di telefono: <input type="tel" name="telefono" id="telefono" pattern="[0-9\s\+\-]*" title="Il numero di telefono non può contenere lettere."><br>
        Data di nascita:<input type="date" name="dataDiNascita" id="dataDiNascita" min="1900-01-02" max="2007-12-31" required><br>
        
        Genere: 
        <!-- basta inserire required una sola volta-->
        <input type="radio" name="genere" id="genereMaschio" value="maschio" required> M
        <input type="radio" name="genere" id="genereFemmina" value="femmina"> F
        <input type="radio" name="genere" id="genereAltro" value="altro"> Altro<br>
        
        Interessi: 
        <input type="checkbox" name="interessi" value="Romanzi"> Romanzi 
        <input type="checkbox" name="interessi" value="Saggistica"> Saggistica
        <input type="checkbox" name="interessi" value="Fumetti"> Fumetti
        <input type="checkbox" name="interessi" value="Altro"> Altro<br>
        
        Tipo di abbonamento: 
        <select name="abbonamento" id="abbonamento" required>
            <option value="" disabled selected>Scegli...</option>
            <option value="mensile">Mensile</option>
            <option value="annuale">Annuale</option>
            <option value="premium">Premium</option>
        </select>
        <br>
        
        Foto profilo: <input type="file" name="foto" id="foto"><br>
        Preferenza notifiche: <input type="range" name="frequenzaNotifiche" id="frequenzaNotifiche" min="0" max="10"><br>
        Note aggiuntive: <br><textarea name="note" id="note"></textarea><br>

        <input type="submit" value="Invia">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
